[workspace]
name = "pico-tianji-real-teleop"
version = "0.3.0"
description = "PICO、对齐动捕人手和 H5 回放到 Marvin 双臂遥操作与 MuJoCo 仿真"
channels = ["conda-forge", "robostack-staging"]
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
numpy = "2.2.*"
scipy = "1.14.*"
pyyaml = ">=6,<7"
mujoco = ">=3.2,<4"
packaging = ">=24,<26"
lark = ">=1.1,<2"
netifaces = ">=0.11,<1"
h5py = ">=3.10,<4"

[pypi-dependencies]
# zenoh-python：PyPI 包名 eclipse-zenoh，import 名 zenoh
eclipse-zenoh = ">=1.10,<2"

[tasks]
doctor = "bash scripts/doctor.sh"
test = "bash scripts/test.sh"
status = "bash scripts/status.sh"
pico_sim = { cmd = "bash scripts/run_session.sh --profile pico_sim" }
pico_real = { cmd = "bash scripts/run_session.sh --profile pico_real" }
mocap_live_sim = { cmd = "bash scripts/run_session.sh --profile mocap_live_sim" }
mocap_live_real = { cmd = "bash scripts/run_session.sh --profile mocap_live_real" }
h5_sim = { cmd = "bash scripts/run_session.sh --profile h5_sim" }
h5_real = { cmd = "bash scripts/run_session.sh --profile h5_real" }
target_replay_sim = { cmd = "bash scripts/run_session.sh --profile target_replay_sim" }
joint_replay_sim = { cmd = "bash scripts/run_session.sh --profile joint_replay_sim" }
diagnostic-mocap-calibration-sim = { cmd = "bash scripts/run_session.sh --profile diagnostic_mocap_calibration_sim" }
wuji_hand2_dry = { cmd = "bash scripts/run_session.sh --profile h5_sim" }
wuji_hand2_real = { cmd = "bash scripts/run_session.sh --profile h5_real" }
validation-run = "python scripts/validation/run_case.py"
validation-analyze = "python scripts/validation/analyze_runs.py"
validation-scan-real = "python scripts/validation/scan_real_preflight.py"
# C++ IK 使用独立环境，避免 Pinocchio 开发依赖扰动便携运行环境。
# 编译器使用 Ubuntu 24.04 系统 GCC 13；脚本会在编译前严格检查它们与
# runtime 的 ABI 版本。
[feature.ik-build.dependencies]
python = "3.12.*"
numpy = ">=2,<3"
packaging = ">=24,<26"
pyyaml = ">=6,<7"
cmake = ">=3.22"
eigen = "*"
urdfdom_headers = "*"

[feature.ik-build.pypi-dependencies]
pin = "==4.0.0"
eclipse-zenoh = ">=1.10,<2"

[feature.ik-build.tasks]
check-ik-build-env = "bash scripts/check_ik_build_env.sh"
build-ik = { cmd = "bash scripts/build_ik.sh", depends-on = ["check-ik-build-env"] }
deploy-ik = "bash scripts/deploy_ik_runtime.sh"

[environments]
ik-build = { features = ["ik-build"], no-default-feature = true }
