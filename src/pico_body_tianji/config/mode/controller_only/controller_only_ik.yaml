pico_controller_only_input:
  ros__parameters:
    rate: 90.0
    stale_timeout: 0.5
    require_reliable_timestamp: true
    allow_unstamped_input: false
    min_cutoff: 1.0
    beta: 0.7
    # 相对手柄目标先经过尺度、椭球软工作空间、速度和加速度整形。
    translation_gain: [0.75, 0.75, 0.75]
    rotation_gain: 0.85
    workspace_relative_radii_m: [0.32, 0.28, 0.28]
    workspace_soft_zone_ratio: 0.80
    maximum_linear_speed_m_s: 0.18
    maximum_angular_speed_rad_s: 0.80
    maximum_linear_acceleration_m_s2: 1.20
    maximum_angular_acceleration_rad_s2: 4.0
    # 厂商 FK_NSP 在左右 Home 返回的参考平面方向，用于稳定第七自由度。
    left_default_zsp_direction: [0.45638698, -0.74604902, -0.48489358]
    right_default_zsp_direction: [0.45638698, 0.74604902, -0.48489358]

tianji_kinematic_sim:
  ros__parameters:
    # 仅手柄模式只在这里选择 IK：
    # pinocchio_cpp / pinocchio_qp / tianji_official。
    ik_backend: tianji_official

    # 仅手柄模式公共频率、回零和安全契约。
    rate: 90.0
    home_minimum_duration: 2.0
    home_max_speed_deg_s: 25.0
    joint_limit_margin_deg: 5.0
    # 0.20° @ 90 Hz = 18°/s，低于真机桥默认的 22.5°/s，避免目标积压。
    max_joint_step_deg: 0.62
    position_tolerance_m: 0.001
    orientation_tolerance_deg: 0.6
    # Pinocchio 不使用人体臂角；官方 IK 由下面的固定 ZSP 单独稳定冗余支路。
    arm_angle_gain: 0.0
    arm_angle_tolerance_deg: 2.0
    arm_angle_merit_weight: 0.0
    left_home_deg: [55.0, -65.0, -70.0, -60.0, 60.0, 0.0, 0.0]
    right_home_deg: [-55.0, -65.0, 70.0, -60.0, -60.0, 0.0, 0.0]

    # 天机官方 IK。留空时 runtime 包装器使用项目内置 SDK 和机型配置。
    official_ik_library: ""
    official_ik_config: ""
    official_use_zsp: true
    # dgr1/2/3 保持厂商原始单位；只有掌握对应 SDK 定义后才调整。
    official_dgr1: 0.05
    official_dgr2: 0.05
    official_dgr3: 0.0
    official_joint_limit_soft_margin_deg: 5.0
    official_candidate_continuity_weight: 1.0
    official_candidate_limit_weight: 0.20
    official_candidate_posture_weight: 0.02
    official_orientation_relaxation_steps: 3
    official_workspace_backoff_iterations: 8
    official_worker_timeout_ms: 25
    official_worker_restart_attempts: 1

    # pinocchio_cpp：迭代 DLS、冗余选解和奇异规避参数。
    max_iterations: 24
    max_iteration_step_deg: 4.5
    minimum_damping: 0.001
    maximum_damping: 0.15
    singular_value_threshold: 0.05
    nullspace_damping: 0.001
    joint_center_gain: 0.3
    joint_center_activation_margin_deg: 15.0
    joint_center_merit_weight: 0.001
    singularity_avoidance_gain: 0.2
    singularity_merit_weight: 0.01

    # pinocchio_qp：任务权重、硬约束和奇异恢复参数。
    qp_position_time_constant_s: 0.30
    qp_orientation_time_constant_s: 0.40
    qp_max_linear_speed_m_s: 0.25
    qp_max_angular_speed_rad_s: 1.00
    qp_joint_velocity_limits_deg_s: [55.0, 55.0, 55.0, 55.0, 55.0, 55.0, 55.0]
    qp_position_weight: 1.0
    qp_orientation_weight: 0.45
    qp_velocity_regularization_weight: 0.02
    qp_continuity_weight: 0.06
    qp_posture_weight: 0.008
    qp_posture_time_constant_s: 2.5
    qp_joint_limit_activation_margin_deg: 15.0
    qp_joint_limit_velocity_damper_gain: 4.0
    qp_singularity_critical_threshold: 0.015
    qp_singularity_orientation_scale: 0.15
    qp_singularity_posture_multiplier: 8.0
    qp_singularity_velocity_multiplier: 4.0
    qp_singularity_escape_weight: 0.03
    qp_singularity_escape_speed_deg_s: 8.6
    qp_max_active_set_iterations: 48
    qp_active_set_tolerance: 1.0e-9
