schema_name: tianji-validation-matrix
schema_version: "1.0"
cases:
  acquisition_live:
    profile: acquisition_live
    required_devices: [router, acquisition, aligned_mocap]
    required_capability: simulation
    active_sides: [left, right]
    hand_mode: disabled
    velocity_ratio: 1.0
    acceleration_ratio: 1.0
    max_duration_s: 300
    prerequisites: []
    stop_criteria:
      dangerous: [wrong_direction_or_side, physical_limit, collision_risk, feedback_stale, tracking_threshold, device_or_servo_error, duplicate_authority, router_zid_change, emergency_stop]
      controlled: [operator_normal_end_with_fresh_feedback]
