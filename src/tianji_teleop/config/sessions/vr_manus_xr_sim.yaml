# Simulation-only PICO + VR controller/Tracker + Manus contract.
# Component composition is in sessions/vr_manus_xr_runtime.yaml.
input_mode: vr_manus
hand_input: manus
arm_input: xr_tracker
operator_input: controller
required_capability: simulation
active_sides: [left, right]
active_hand_sides: [left, right]
ik_backend: pico_ee_dexhand_qp
arm_pose_mapper: xr_incremental
retarget_owner: mapper
hand_retarget_backend: official_wuji_hand2
arm_target_processor: passthrough
joint_trajectory: passthrough
command_step_clipping: false
joint_limit_source: urdf
rate_hz: 200.0
