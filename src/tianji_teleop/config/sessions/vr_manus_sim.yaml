# Explicit reference-direct live simulation. Manus rawviz/user supplied at launch.
input_mode: vr_manus
hand_input: manus
arm_input: tjvr_corrected_palm
operator_input: keyboard
required_capability: simulation
active_sides: [left, right]
active_hand_sides: [left, right]
ik_backend: spark_upper_qpoases_headroom_feedforward_velocity_qp
arm_pose_mapper: none
retarget_owner: spark
hand_retarget_backend: official_wuji_hand2
arm_target_processor: passthrough
joint_trajectory: passthrough
command_step_clipping: false
joint_limit_source: urdf
reference_execution_mode: reference_direct
rate_hz: 200.0
