<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">PICO 到 Marvin 天机双臂遥操作数据流</title>
  <desc id="desc">PICO 手柄和 SMPL 数据经过躯干相对映射、Pinocchio IK 与安全门，分别送往 RViz MuJoCo 仿真和 Marvin 真机桥；真机反馈返回安全桥。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-slate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .section { font: 700 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; letter-spacing: 1px; }
      .box-title { font: 700 20px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-text { font: 400 16px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .flow-label { font: 600 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1400" height="900" rx="28" fill="url(#background)"/>
  <text x="700" y="58" text-anchor="middle" class="title">PICO → Marvin 天机双臂遥操作数据流</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">一套 sim 主机链路持续产生安全关节目标；real 只增加 Marvin 真机桥</text>

  <text x="64" y="140" class="section" fill="#2563eb">输入</text>
  <text x="390" y="140" class="section" fill="#7c3aed">映射与求解（sim）</text>
  <text x="930" y="140" class="section" fill="#059669">仿真观察</text>
  <text x="930" y="505" class="section" fill="#ea580c">真机输出（real）</text>

  <g filter="url(#shadow)">
    <rect x="55" y="165" width="270" height="135" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text x="190" y="202" text-anchor="middle" class="box-title">PICO 左右手柄</text>
    <text x="190" y="234" text-anchor="middle" class="box-text">位置 / 姿态</text>
    <text x="190" y="262" text-anchor="middle" class="box-text">右手柄 A 键</text>
    <text x="190" y="286" text-anchor="middle" class="small">XRoboToolkit 127.0.0.1:60061</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="345" width="270" height="135" rx="18" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="190" y="382" text-anchor="middle" class="box-title">SMPL 上肢骨架</text>
    <text x="190" y="414" text-anchor="middle" class="box-text">胸廓 / 肩 / 肘 / 腕</text>
    <text x="190" y="442" text-anchor="middle" class="box-text">实时躯干坐标系 + 臂角</text>
    <text x="190" y="466" text-anchor="middle" class="small">不直接控制机器人末端位置</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="165" width="300" height="150" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="530" y="202" text-anchor="middle" class="box-title">相对末端映射</text>
    <text x="530" y="235" text-anchor="middle" class="box-text">手柄运动变换到实时胸廓系</text>
    <text x="530" y="263" text-anchor="middle" class="box-text">按 A 记录参考位姿</text>
    <text x="530" y="291" text-anchor="middle" class="small">输出左右 TCP 相对位置与姿态目标</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="355" width="300" height="130" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="530" y="392" text-anchor="middle" class="box-title">SMPL 臂角参考</text>
    <text x="530" y="424" text-anchor="middle" class="box-text">肩—肘—腕测量人体肘平面</text>
    <text x="530" y="452" text-anchor="middle" class="small">只进入 7 自由度 IK 零空间次任务</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="735" y="245" width="300" height="165" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="885" y="282" text-anchor="middle" class="box-title">C++ Pinocchio IK</text>
    <text x="885" y="315" text-anchor="middle" class="box-text">阻尼伪逆主任务</text>
    <text x="885" y="343" text-anchor="middle" class="box-text">臂角 / 奇异点 / 限位零空间优化</text>
    <text x="885" y="371" text-anchor="middle" class="small">输出左右 7 关节连续目标</text>
    <text x="885" y="394" text-anchor="middle" class="small">不加载官方 libKine</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1090" y="165" width="255" height="125" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="1217" y="202" text-anchor="middle" class="box-title">RViz</text>
    <text x="1217" y="234" text-anchor="middle" class="box-text">Marvin URDF / SMPL</text>
    <text x="1217" y="262" text-anchor="middle" class="small">目标、FK、肘平面、关节状态</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1090" y="335" width="255" height="125" rx="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="1217" y="372" text-anchor="middle" class="box-title">MuJoCo</text>
    <text x="1217" y="404" text-anchor="middle" class="box-text">只读关节运动学镜像</text>
    <text x="1217" y="432" text-anchor="middle" class="small">不写回真机，不代替安全验收</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="735" y="535" width="300" height="150" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="885" y="572" text-anchor="middle" class="box-title">Marvin 安全桥</text>
    <text x="885" y="605" text-anchor="middle" class="box-text">新鲜度 / 限位 / 斜坡 / 跟踪误差</text>
    <text x="885" y="633" text-anchor="middle" class="box-text">回零、软急停、双臂同步下发</text>
    <text x="885" y="661" text-anchor="middle" class="small">real 进程只启动这一侧</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1090" y="535" width="255" height="150" rx="18" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="1217" y="572" text-anchor="middle" class="box-title">Marvin SDK</text>
    <text x="1217" y="605" text-anchor="middle" class="box-text">state=1 关节位置模式</text>
    <text x="1217" y="633" text-anchor="middle" class="box-text">左右臂成对发送</text>
    <text x="1217" y="661" text-anchor="middle" class="small">有线控制器连接</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1090" y="735" width="255" height="100" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="1217" y="774" text-anchor="middle" class="box-title">Marvin M6 双臂</text>
    <text x="1217" y="806" text-anchor="middle" class="small">实测关节、状态、错误码反馈</text>
  </g>

  <path d="M325 230 H380" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M325 395 C350 395 355 270 380 270" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M325 425 H380" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M680 240 C710 240 710 300 735 300" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M680 420 C710 420 710 360 735 360" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <path d="M1035 290 C1060 290 1060 228 1090 228" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M1035 350 C1060 350 1060 398 1090 398" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="1057" y="312" text-anchor="middle" class="flow-label" fill="#047857">仿真话题</text>

  <path d="M885 410 V535" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="900" y="480" class="flow-label" fill="#c2410c">安全关节目标</text>
  <path d="M1035 610 H1090" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <path d="M1217 685 V735" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <path d="M1090 785 C1015 785 1015 700 940 700 V685" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#arrow-slate)"/>
  <text x="976" y="774" text-anchor="middle" class="flow-label" fill="#475569">30 Hz 实测反馈</text>

  <rect x="55" y="735" width="915" height="100" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="770" class="box-title">运行关系</text>
  <text x="80" y="800" class="box-text">终端 1：pixi run sim 保持运行，唯一负责 PICO、SMPL、IK、RViz/MuJoCo。</text>
  <text x="80" y="826" class="box-text">终端 2：pixi run real -- --confirm-real 只连接 Marvin；退出 real 不会关闭 sim。</text>
</svg>
