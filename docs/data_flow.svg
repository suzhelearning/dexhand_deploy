<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Tianji canonical teleoperation data flow</title>
  <desc id="desc">Sources publish canonical targets to producers, coordinator owns final commands, and executors publish state back.</desc>
  <style>text{font-family:DejaVu Sans, sans-serif;fill:#18212b}.box{fill:#f3f5f7;stroke:#263746;stroke-width:2}.arrow{stroke:#526879;stroke-width:3;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526879"/></marker></defs>
  <rect class="box" x="30" y="120" width="190" height="100" rx="12"/><text x="125" y="158" text-anchor="middle" font-size="20">Sources</text><text x="125" y="187" text-anchor="middle" font-size="14">PICO / aligned hands / H5</text>
  <rect class="box" x="280" y="120" width="190" height="100" rx="12"/><text x="375" y="158" text-anchor="middle" font-size="20">Targets</text><text x="375" y="187" text-anchor="middle" font-size="14">versioned Zenoh v1</text>
  <rect class="box" x="530" y="100" width="200" height="140" rx="12"/><text x="630" y="148" text-anchor="middle" font-size="20">Producers</text><text x="630" y="178" text-anchor="middle" font-size="14">IK / policy / retarget</text><text x="630" y="203" text-anchor="middle" font-size="14">proposal only</text>
  <rect class="box" x="790" y="100" width="180" height="140" rx="12"/><text x="880" y="148" text-anchor="middle" font-size="20">Coordinator</text><text x="880" y="178" text-anchor="middle" font-size="14">state + Home +</text><text x="880" y="203" text-anchor="middle" font-size="14">final command</text>
  <rect class="box" x="1030" y="100" width="140" height="140" rx="12"/><text x="1100" y="148" text-anchor="middle" font-size="20">Executors</text><text x="1100" y="178" text-anchor="middle" font-size="14">MuJoCo /</text><text x="1100" y="203" text-anchor="middle" font-size="14">Marvin / Wuji</text>
  <path class="arrow" d="M220 170 H280"/><path class="arrow" d="M470 170 H530"/><path class="arrow" d="M730 170 H790"/><path class="arrow" d="M970 170 H1030"/><path class="arrow" d="M1100 250 V315 H880 V240"/>
  <text x="985" y="312" text-anchor="middle" font-size="14">typed state/status feedback</text>
  <text x="600" y="45" text-anchor="middle" font-size="16">single router: TIANJI_ROUTER_ENDPOINT (default tcp/127.0.0.1:7447)</text>
</svg>
